services:
  web:
    build: .
    depends_on:
      db:
        condition: "service_healthy"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./:/code:ro
    env_file:
      .env
    ports:
      - "8000:8000"
    restart: always

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - ${POSTGRES_PORT}:5432
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    env_file:
      .env
    healthcheck:
    # $$ forces the varible resolution inside the container instead of the host machine
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: